# Builds, tests and publishes Got Bored.
#  - Every push / PR touching MultiGameHub/: unit tests + Android APK build.
#  - Pushing a tag vX.Y.Z (matching MultiGameHub/VERSION): signed release with
#    APK, content packs and manifest.json -> picked up by the in-app updater.
#
# Required repository secrets for releases (all releases MUST use the same key):
#   MGH_KEYSTORE_BASE64   base64 of the release keystore (.jks)
#   MGH_KEYSTORE_PASSWORD, MGH_KEY_ALIAS, MGH_KEY_PASSWORD
name: Got Bored

on:
  # Tag pushes always run (no path filter); pull requests only when the app changed.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["MultiGameHub/**", ".github/workflows/multigamehub-release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: MultiGameHub
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SDL3
        run: ./scripts/fetch_deps.sh

      - name: Unit tests (desktop)
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          cmake -S . -B build/tests -G Ninja -DMGH_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build/tests
          ./build/tests/mgh_tests

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;36.1.0" "ndk;29.0.14206865"

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.MGH_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::MGH_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MGH_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
          BUILD_TOOLS_VERSION: 36.1.0
          MGH_KEYSTORE_PASSWORD: ${{ secrets.MGH_KEYSTORE_PASSWORD }}
          MGH_KEY_ALIAS: ${{ secrets.MGH_KEY_ALIAS }}
          MGH_KEY_PASSWORD: ${{ secrets.MGH_KEY_PASSWORD }}
        run: |
          sudo apt-get install -y ninja-build
          ./scripts/build_apk.sh
          python3 scripts/check_jni.py build/android/stage/classes

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "${GITHUB_REF_NAME}" = "v$(tr -d '[:space:]' < VERSION)" || { echo "::error::tag does not match VERSION"; exit 1; }

      - name: Prepare release assets
        run: |
          NOTES=release-notes.txt
          git log -1 --pretty=%B > "$NOTES"
          [ -f CHANGELOG-next.md ] && cp CHANGELOG-next.md "$NOTES"
          python3 scripts/make_release.py --apk build/android/GotBored-$(cat VERSION).apk \
            --out build/release --repo "${GITHUB_REPOSITORY}" --notes "$NOTES"
          cmake -S . -B build/tools -G Ninja -DMGH_BUILD_APP=OFF && cmake --build build/tools --target manifest_check
          ./build/tools/manifest_check build/release/manifest.json build/release

      - uses: actions/upload-artifact@v4
        with:
          name: multigamehub-release
          path: MultiGameHub/build/release/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Got Bored ${{ github.ref_name }}
          files: |
            MultiGameHub/build/release/*.apk
            MultiGameHub/build/release/*.zip
            MultiGameHub/build/release/manifest.json
